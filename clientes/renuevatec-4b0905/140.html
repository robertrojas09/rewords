<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Rewords — Raúl Cruz Delgado</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0D1B2A;--card:#162436;--blue:#4A9EDB;--blue-lt:#7DBFE8;--white:#E8EDF2;--gray:#8BA3B8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Exo 2",sans-serif;overflow:hidden;}
    body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(74,158,219,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(74,158,219,0.04) 1px,transparent 1px);background-size:32px 32px;animation:grid 20s linear infinite;pointer-events:none;}
    @keyframes grid{0%{transform:translateY(0)}100%{transform:translateY(32px)}}
    .particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
    .particle{position:absolute;width:2px;height:2px;background:var(--blue);border-radius:50%;animation:up linear infinite;opacity:0;}
    @keyframes up{0%{transform:translateY(100vh);opacity:0}10%{opacity:.6}90%{opacity:.2}100%{transform:translateY(-20px) translateX(30px);opacity:0}}
    .card{position:relative;width:340px;background:var(--card);border-radius:24px;border:1px solid rgba(74,158,219,.2);box-shadow:0 0 60px rgba(74,158,219,.12),0 0 120px rgba(74,158,219,.06);overflow:hidden;animation:ci .8s cubic-bezier(.34,1.56,.64,1) both;}
    @keyframes ci{from{transform:scale(.85) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
    .bday{background:linear-gradient(135deg,#FF9F0A,#FF453A);padding:10px;text-align:center;font-family:"Orbitron",monospace;font-size:11px;color:#fff;letter-spacing:1px;display:none;}
    .promo{background:linear-gradient(135deg,var(--blue),var(--blue-lt));padding:10px;text-align:center;font-family:"Exo 2",sans-serif;font-weight:600;font-size:12px;color:#fff;letter-spacing:.5px;}
    .promo:empty{display:none;padding:0;}
    .coin-wrap{position:relative;display:flex;justify-content:center;padding:32px 0 4px;perspective:900px;}
    .coin{width:140px;height:140px;position:relative;transform-style:preserve-3d;animation:spin-coin 4s linear infinite;}
    .coin-face{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid var(--blue);
      box-shadow:0 0 0 6px rgba(74,158,219,.12),0 12px 30px rgba(0,0,0,.4);backface-visibility:hidden;}
    .coin-face img{width:100%;height:100%;object-fit:cover;display:block;}
    .coin-face.back{transform:rotateY(180deg);}
    @keyframes spin-coin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
    .body{padding:14px 28px 28px;text-align:center;}
    .name{font-family:"Orbitron",monospace;font-size:15px;font-weight:700;color:var(--white);letter-spacing:1px;line-height:1.5;animation:fu .6s .3s both;}
    @keyframes fu{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
    .badge{display:inline-flex;align-items:center;gap:8px;margin:14px auto;padding:7px 20px;background:rgba(74,158,219,.1);border:1px solid rgba(74,158,219,.3);border-radius:50px;animation:fu .6s .4s both;}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pd 1.5s ease-in-out infinite;}
    @keyframes pd{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
    .id{font-family:"Orbitron",monospace;font-size:11px;color:var(--blue);letter-spacing:3px;}
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(74,158,219,.3),transparent);margin:18px 0;animation:fu .6s .5s both;}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;animation:fu .6s .6s both;}
    .brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid rgba(74,158,219,.3);}
    .brand-name{font-family:"Orbitron",monospace;font-size:10px;font-weight:700;color:var(--white);letter-spacing:2px;}
    .brand-sub{font-size:9px;color:var(--gray);letter-spacing:1px;margin-top:2px;}
    .nfc{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:6px;animation:fu .6s .7s both;}
    .nfc svg{width:18px;height:18px;opacity:.4;}
    .nfc span{font-size:8px;color:var(--gray);letter-spacing:2px;text-transform:uppercase;}
    .corner{position:absolute;width:16px;height:16px;border-color:var(--blue);border-style:solid;opacity:.5;}
    .tl{top:12px;left:12px;border-width:2px 0 0 2px}.tr{top:12px;right:12px;border-width:2px 2px 0 0}
    .bl{bottom:12px;left:12px;border-width:0 0 2px 2px}.br{bottom:12px;right:12px;border-width:0 2px 2px 0}
    .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0;animation:sc 4s ease-in-out 1s infinite;z-index:10;}
    @keyframes sc{0%{top:0;opacity:0}10%{opacity:.5}90%{opacity:.15}100%{top:100%;opacity:0}}
  </style>
</head>
